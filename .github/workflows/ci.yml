name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: unit offline tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests offline from live providers
        run: POLICYNIM_PROVIDER_NVIDIA_ENABLED=false ./mvnw -B --no-transfer-progress test

  integration:
    name: jdbc integration tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run JDBC integration tests offline from live providers
        run: POLICYNIM_PROVIDER_NVIDIA_ENABLED=false ./mvnw -B --no-transfer-progress test-compile -Dit.test=io.policynim.persistence.jdbc.*IT failsafe:integration-test failsafe:verify
      - name: Verify installed JDBC search
        run: |
          export POLICYNIM_PROVIDER_NVIDIA_ENABLED=false
          ./mvnw -B --no-transfer-progress -DskipTests package
          sha256sum target/policynim.jar
          ./mvnw -B --no-transfer-progress -Dit.test=PackagedJdbcSearchIT failsafe:integration-test failsafe:verify

  acceptance:
    name: acceptance tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run acceptance tests offline from live providers
        run: POLICYNIM_PROVIDER_NVIDIA_ENABLED=false ./mvnw -B --no-transfer-progress test-compile -Dit.test=PolicyNimAcceptanceIT failsafe:integration-test failsafe:verify

  archunit:
    name: architecture rules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run architecture checks offline from live providers
        run: POLICYNIM_PROVIDER_NVIDIA_ENABLED=false ./mvnw -B --no-transfer-progress -Dtest=PackageArchitectureTest test

  package:
    name: jar package smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build jar package offline from live providers
        run: |
          POLICYNIM_PROVIDER_NVIDIA_ENABLED=false ./mvnw -B --no-transfer-progress -DskipTests package
          sha256sum target/policynim.jar
          jar tf target/policynim.jar | grep -F BOOT-INF/classes/application.yml
      - name: Verify packaged MCP sessions and source catalog commands
        run: POLICYNIM_PROVIDER_NVIDIA_ENABLED=false ./mvnw -B --no-transfer-progress -Dit.test=PackagedStdioIT,PackagedHttpIT,PackagedAlternateProtocolsIT,GroundedHttpIT,GroundedStdioIT,PackagedSourceCatalogIT,PackagedExplicitPackIT failsafe:integration-test failsafe:verify
      - name: Check out the Python PolicyNIM reference
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: nnennandukwe/policyNIM
          ref: fcc5322a6672b0275dcc6e0c299e631df8e8de19
          path: build/parity-python
          persist-credentials: false
      - name: Install uv for the pinned Python reference
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install the Python reference wheel and its locked runtime
        working-directory: build/parity-python
        run: |
          uv sync --locked --no-default-groups --no-install-project --no-build --python 3.12.10
          # The reference pins Hatchling. Its four build dependencies are outside the runtime lock.
          printf '%s\n' 'packaging==26.3' 'pathspec==1.1.1' 'pluggy==1.6.0' 'trove-classifiers==2026.9.21.13' > "$RUNNER_TEMP/pack-build-constraints.txt"
          uv build --wheel --python .venv/bin/python --build-constraints "$RUNNER_TEMP/pack-build-constraints.txt"
          uv pip install --no-deps dist/policynim-0.3.0-py3-none-any.whl
          uv pip check
      - name: Compare installed Java and Python pack commands offline
        run: build/parity-python/.venv/bin/python -B src/test/parity/explicit_pack.py --jar target/policynim.jar --reference-root build/parity-python
