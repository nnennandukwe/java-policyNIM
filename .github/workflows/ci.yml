name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: unit offline tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests offline from live providers
        run: POLICYNIM_PROVIDER_NVIDIA_ENABLED=false ./mvnw -B --no-transfer-progress test

  integration:
    name: jdbc integration tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run JDBC integration tests offline from live providers
        run: POLICYNIM_PROVIDER_NVIDIA_ENABLED=false ./mvnw -B --no-transfer-progress test-compile -Dit.test=io.policynim.persistence.jdbc.*IT failsafe:integration-test failsafe:verify
      - name: Verify installed JDBC search
        run: |
          export POLICYNIM_PROVIDER_NVIDIA_ENABLED=false
          ./mvnw -B --no-transfer-progress -DskipTests package
          sha256sum target/policynim.jar
          ./mvnw -B --no-transfer-progress -Dit.test=PackagedJdbcSearchIT failsafe:integration-test failsafe:verify

  acceptance:
    name: acceptance tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run acceptance tests offline from live providers
        run: POLICYNIM_PROVIDER_NVIDIA_ENABLED=false ./mvnw -B --no-transfer-progress test-compile -Dit.test=PolicyNimAcceptanceIT failsafe:integration-test failsafe:verify

  archunit:
    name: architecture rules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run architecture checks offline from live providers
        run: POLICYNIM_PROVIDER_NVIDIA_ENABLED=false ./mvnw -B --no-transfer-progress -Dtest=PackageArchitectureTest test

  package:
    name: jar package smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build jar package offline from live providers
        run: |
          POLICYNIM_PROVIDER_NVIDIA_ENABLED=false ./mvnw -B --no-transfer-progress -DskipTests package
          sha256sum target/policynim.jar
          jar tf target/policynim.jar | grep -F BOOT-INF/classes/application.yml
      - name: Verify packaged MCP sessions and source catalog commands
        run: POLICYNIM_PROVIDER_NVIDIA_ENABLED=false ./mvnw -B --no-transfer-progress -Dit.test=PackagedStdioIT,PackagedHttpIT,PackagedAlternateProtocolsIT,GroundedHttpIT,GroundedStdioIT,PackagedSourceCatalogIT,PackagedExplicitPackIT,PackagedBundledAssetsIT,PackagedReadOnlyProfilesIT,PackagedProfileAuthoringIT failsafe:integration-test failsafe:verify
      - name: Install the pinned reference wheel and its locked runtime
        uses: ./.github/actions/install-parity-reference
      - name: Compare native profile updates across the installed wheel and jar
        run: build/parity-python/.venv/bin/python -B src/test/parity/profile_update.py --jar target/policynim.jar --reference-root build/parity-python
      - name: Compare installed Java and Python pack commands offline
        run: build/parity-python/.venv/bin/python -B src/test/parity/explicit_pack.py --jar target/policynim.jar --reference-root build/parity-python
      - name: Compare the installed wheel and jar over authenticated HTTP
        run: build/parity-python/.venv/bin/python -B src/test/parity/grounded_http.py --jar target/policynim.jar --reference-root build/parity-python
      - name: Build the runtime image from the repository Dockerfile
        run: docker build --iidfile "$RUNNER_TEMP/policynim-image-id" .
      - name: Compare the installed wheel, jar and nonroot image with the pinned bundle
        run: |
          build/parity-python/.venv/bin/python -B src/test/parity/bundled_source.py \
            --jar target/policynim.jar --reference-root build/parity-python \
            --image "$(cat "$RUNNER_TEMP/policynim-image-id")"
      - name: Compare read-only profile commands across the installed wheel, jar and image
        run: |
          build/parity-python/.venv/bin/python -B src/test/parity/read_only_profiles.py \
            --jar target/policynim.jar --reference-root build/parity-python \
            --image "$(cat "$RUNNER_TEMP/policynim-image-id")"
      - name: Verify new profiles and source changes through the installed wheel, jar and image
        run: |
          build/parity-python/.venv/bin/python -B src/test/parity/profile_authoring.py \
            --jar target/policynim.jar --reference-root build/parity-python \
            --image "$(cat "$RUNNER_TEMP/policynim-image-id")"
