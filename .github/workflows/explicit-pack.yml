name: explicit pack platforms

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  installed-pack:
    name: explicit pack on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            wrapper: ./mvnw
            python: python3
            source_tests: PackagedSourceCatalogIT
          - os: windows-2025
            wrapper: .\mvnw.cmd
            python: python
            source_tests: PackagedSourceCatalogIT#sourceSettingsRespectExplicitRootAndRecoverFromFailedSelection
    env:
      POLICYNIM_PROVIDER_NVIDIA_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify native pack access and profile publication
        run: ${{ matrix.wrapper }} -B --no-transfer-progress "-Dtest=PackDirectoryTests,ProfileCommandTests,ProfileInitializerTests,ProfilePublicationTests,PosixProfileDirectoryTests,WindowsProfilePathTests,WindowsProfileStageTests,ProfilePinEditorTests,ProfileUpdateTests,PosixProfileUpdateTests,WindowsProfileUpdateTests" test
      - name: Package the installed jar
        run: ${{ matrix.wrapper }} -B --no-transfer-progress -DskipTests package
      - name: Verify source inspection and bundled assets in the installed jar
        run: ${{ matrix.wrapper }} -B --no-transfer-progress "-Dit.test=${{ matrix.source_tests }},PackagedExplicitPackIT,PackagedBundledAssetsIT,PackagedReadOnlyProfilesIT,PackagedProfileAuthoringIT" failsafe:integration-test failsafe:verify
      - name: Install the pinned reference wheel and its locked runtime
        id: reference
        uses: ./.github/actions/install-parity-reference
      - name: Compare native profile updates across the installed wheel and jar
        shell: bash
        env:
          REFERENCE_PYTHON: ${{ steps.reference.outputs.python }}
        run: '"$REFERENCE_PYTHON" -B src/test/parity/profile_update.py --jar target/policynim.jar --reference-root build/parity-python'
      - name: Compare the installed jar with all 26 archived policy records
        run: ${{ matrix.python }} -I -S src/test/parity/archived_pack.py --jar target/policynim.jar --reference-root build/parity-python
