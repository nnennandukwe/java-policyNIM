name: explicit pack platforms

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  installed-pack:
    name: explicit pack on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            wrapper: ./mvnw
            python: python3
            source_tests: PackagedSourceCatalogIT
          - os: windows-2025
            wrapper: .\mvnw.cmd
            python: python
            source_tests: PackagedSourceCatalogIT#sourceSettingsRespectExplicitRootAndRecoverFromFailedSelection
    env:
      POLICYNIM_PROVIDER_NVIDIA_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Check out the pinned policy sources and generation archive
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: nnennandukwe/policyNIM
          ref: fcc5322a6672b0275dcc6e0c299e631df8e8de19
          path: pinned-python
          sparse-checkout: |
            policies
            artifacts/public-generation
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify native pack access and profile publication
        run: ${{ matrix.wrapper }} -B --no-transfer-progress "-Dtest=PackDirectoryTests,ProfileCommandTests,ProfileInitializerTests,ProfilePublicationTests" test
      - name: Package the installed jar
        run: ${{ matrix.wrapper }} -B --no-transfer-progress -DskipTests package
      - name: Verify source inspection and bundled assets in the installed jar
        run: ${{ matrix.wrapper }} -B --no-transfer-progress "-Dit.test=${{ matrix.source_tests }},PackagedExplicitPackIT,PackagedBundledAssetsIT,PackagedReadOnlyProfilesIT,PackagedProfileAuthoringIT" failsafe:integration-test failsafe:verify
      - name: Compare the installed jar with all 26 archived policy records
        run: ${{ matrix.python }} -I -S src/test/parity/archived_pack.py --jar target/policynim.jar --reference-root pinned-python
