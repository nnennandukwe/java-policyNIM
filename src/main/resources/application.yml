spring:
  application:
    name: PolicyNim
  flyway:
    placeholders:
      tableName: ${policynim.storage.table-name}

policynim:
  mcp:
    name: PolicyNIM
    transport: streamable-http
    host: 127.0.0.1
    port: 8080
    streamable-http-path: /mcp
    auth:
      enabled: false
      bearer-token: ${POLICYNIM_MCP_BEARER_TOKEN:}
  storage:
    mode: noop
    table-name: policy_chunks
  provider:
    nvidia:
      enabled: false
      base-url: https://ai.api.nvidia.com
      embedding-model: nvidia/llama-3.2-nv-embedqa-1b-v2
      rerank-model: nvidia/llama-nemotron-rerank-1b-v2
